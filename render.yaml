# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Configured for Render's FREE tier so reviewers never need a paid service.
#
# Two consequences of `plan: free`, both deliberate and documented:
#
#   1. No persistent disk. Free services cannot attach one, so the SQLite file
#      lives on an ephemeral filesystem. The app migrates and seeds itself on
#      boot (src/instrumentation.ts), so the demo accounts and seed documents
#      are always present — but documents a reviewer creates do not survive a
#      restart or a spin-down.
#   2. Idle spin-down after ~15 minutes, so the first request afterwards takes
#      up to a minute.
#
# For persistence on Render, switch `plan` to `starter` and re-add:
#   disk:
#     name: ajaia-data
#     mountPath: /var/data
#     sizeGB: 1
# plus DATABASE_PATH=/var/data/ajaia.db. See docs/DEPLOYMENT.md for the full
# comparison against Railway and Fly.
services:
  - type: web
    name: ajaia-docs
    runtime: node
    plan: free
    region: oregon
    # `--include=dev` is required: Render sets NODE_ENV=production, which makes
    # a plain `npm ci` skip devDependencies — and the build needs TypeScript,
    # Tailwind and the PostCSS plugin, all of which live there.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    envVars:
      # Node 22 LTS. package.json requires >= 20.11.
      - key: NODE_VERSION
        value: "22"
      # HMAC key for session cookies; the server refuses to boot without it.
      - key: SESSION_SECRET
        generateValue: true
      # Free instances are memory-constrained; keep the Next.js build inside it.
      - key: NODE_OPTIONS
        value: --max-old-space-size=460
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
